<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gladio — Veni. Vidi. Vicerunt.</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300;1,400;1,600&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #0A0A0A;
  --bg2:   #111111;
  --bg3:   #181818;
  --sf:    #1E1E1E;
  --bd:    rgba(255,255,255,.07);
  --bd2:   rgba(255,255,255,.13);
  --red:   #E8192C;
  --rdim:  rgba(232,25,44,.10);
  --rmid:  rgba(232,25,44,.30);
  --rhigh: rgba(232,25,44,.50);
  --wh:    #F5F5F5;
  --off:   #AAAAAA;
  --mt:    #666666;
  --green: #22C55E;
  --fd: 'Barlow Condensed', sans-serif;
  --fb: 'Barlow', sans-serif;
  --fm: 'DM Mono', monospace;
}

*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  background:var(--bg);
  color:var(--wh);
  font-family:var(--fb);
  font-weight:300;
  overflow-x:hidden;
  cursor:none;
}

/* ── CURSOR ── */
.cur { position:fixed; width:7px; height:7px; background:var(--red); border-radius:50%; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); transition:width .15s,height .15s; }
.cur-ring { position:fixed; width:28px; height:28px; border:1px solid rgba(232,25,44,.4); border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition:width .25s,height .25s; }

/* ── NAV ── */
nav {
  position:fixed; top:0; width:100%; z-index:500;
  padding:1.2rem 3rem;
  display:flex; justify-content:space-between; align-items:center;
  background:rgba(10,10,10,.9);
  backdrop-filter:blur(24px);
  border-bottom:1px solid var(--bd);
}

.nav-logo {
  font-family:var(--fd); font-weight:900; font-size:1.45rem;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--wh); text-decoration:none;
  display:flex; align-items:center; gap:.55rem;
}
.nav-icon { width:22px; height:22px; flex-shrink:0; }
.nav-logo-dot {
  width:6px; height:6px; background:var(--red); border-radius:50%;
  animation:blink 2.2s ease-in-out infinite; flex-shrink:0;
}

.nav-links { display:flex; gap:2.5rem; list-style:none; }
.nav-links a {
  font-size:.72rem; font-weight:400; letter-spacing:.1em; text-transform:uppercase;
  color:var(--mt); text-decoration:none; transition:color .2s;
}
.nav-links a:hover { color:var(--wh); }

.nav-cta {
  font-family:var(--fb); font-size:.7rem; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase;
  color:var(--wh); background:var(--red);
  padding:.5rem 1.25rem; text-decoration:none; transition:opacity .18s;
}
.nav-cta:hover { opacity:.82; }

/* ── HERO ── */
.hero {
  min-height:100vh;
  display:grid; grid-template-columns:1fr 1fr;
  align-items:center;
  padding:8rem 3rem 5rem;
  position:relative; overflow:hidden; gap:5rem;
}

.hero-arena { position:absolute; inset:0; pointer-events:none; overflow:hidden; opacity:.18; }
.hero-arena svg { position:absolute; right:-5%; top:50%; transform:translateY(-50%); width:65%; height:auto; }

.hero-grid {
  position:absolute; inset:0; pointer-events:none;
  background-image:
    linear-gradient(var(--bd) 1px, transparent 1px),
    linear-gradient(90deg, var(--bd) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse 60% 90% at 18% 50%, black 0%, transparent 80%);
}

.hero-glow {
  position:absolute; top:-10%; right:-8%;
  width:52vw; height:52vw;
  background:radial-gradient(circle, rgba(232,25,44,.055) 0%, transparent 60%);
  pointer-events:none;
}

.hero-ghost {
  position:absolute; bottom:-4rem; left:50%; transform:translateX(-48%);
  font-family:var(--fd); font-weight:900; font-size:21vw;
  text-transform:uppercase; letter-spacing:.04em;
  color:rgba(255,255,255,.025); pointer-events:none; white-space:nowrap;
  line-height:1; user-select:none;
}

.hero-left { position:relative; z-index:2; }

.hero-eyebrow {
  display:inline-flex; align-items:center; gap:.55rem;
  font-family:var(--fm); font-size:.6rem; letter-spacing:.22em; text-transform:uppercase;
  color:var(--red); margin-bottom:1.4rem;
  animation:fadeUp .65s ease both;
}
.eyebrow-line { width:20px; height:1px; background:var(--red); }

.hero-brand {
  font-family:var(--fd); font-weight:900;
  font-size:clamp(5.5rem, 12vw, 10.5rem);
  line-height:.86; text-transform:uppercase; letter-spacing:.015em;
  color:var(--wh); margin-bottom:1rem;
  animation:fadeUp .65s ease .08s both;
}

.hero-latin {
  display:flex; align-items:baseline; gap:.55rem;
  margin-bottom:1.6rem;
  animation:fadeUp .65s ease .16s both;
}
.lw { font-family:var(--fd); font-weight:600; font-size:clamp(1rem, 2vw, 1.45rem); text-transform:uppercase; letter-spacing:.08em; }
.lw.a { color:var(--off); }
.lw.b { color:var(--off); }
.lw.c { color:var(--red); }
.l-sep { color:var(--mt); font-size:.85rem; }

.hero-translation {
  font-family:var(--fb); font-size:.8rem; font-weight:300; font-style:italic;
  color:var(--mt); letter-spacing:.06em; margin-bottom:2.2rem;
  animation:fadeUp .65s ease .22s both;
}
.hero-translation em { color:var(--off); font-style:normal; }

.hero-desc {
  font-size:.98rem; font-weight:300; line-height:1.82;
  color:var(--mt); max-width:430px; margin-bottom:2.8rem;
  animation:fadeUp .65s ease .28s both;
}

.hero-actions { display:flex; align-items:center; gap:1.5rem; animation:fadeUp .65s ease .34s both; }

.btn-primary {
  font-family:var(--fb); font-size:.75rem; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase;
  background:var(--red); color:var(--wh);
  padding:.88rem 2rem; text-decoration:none;
  transition:transform .18s, box-shadow .18s;
  position:relative; overflow:hidden;
}
.btn-primary::after { content:''; position:absolute; inset:0; background:white; opacity:0; transition:opacity .18s; }
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(232,25,44,.32); }
.btn-primary:hover::after { opacity:.06; }

.btn-ghost {
  font-size:.75rem; font-weight:400; letter-spacing:.08em;
  color:var(--off); text-decoration:none;
  display:flex; align-items:center; gap:.45rem; transition:color .18s;
}
.btn-ghost:hover { color:var(--wh); }
.btn-ghost svg { transition:transform .18s; }
.btn-ghost:hover svg { transform:translateX(4px); }

.hero-right { position:relative; z-index:2; animation:fadeUp .65s ease .42s both; }

.dashboard {
  background:var(--sf);
  border:1px solid var(--bd2); border-radius:9px;
  overflow:hidden;
  box-shadow:0 44px 88px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.04) inset;
}

.db-header {
  padding:.95rem 1.2rem; background:var(--bg3);
  border-bottom:1px solid var(--bd);
  display:flex; align-items:center; justify-content:space-between;
}
.db-title { font-family:var(--fm); font-size:.58rem; color:var(--mt); letter-spacing:.12em; text-transform:uppercase; }
.live-badge {
  display:flex; align-items:center; gap:.35rem;
  background:var(--rdim); border:1px solid var(--rmid);
  border-radius:20px; padding:.18rem .6rem;
  font-family:var(--fm); font-size:.55rem; color:var(--red); letter-spacing:.1em;
}
.live-dot { width:5px; height:5px; background:var(--red); border-radius:50%; animation:blink 1.4s ease-in-out infinite; }

.db-body { padding:.85rem; display:flex; flex-direction:column; gap:.35rem; }

.match-row {
  display:grid; grid-template-columns:52px 1fr auto 1fr 52px;
  align-items:center; gap:.45rem;
  padding:.65rem .7rem; border-radius:4px;
  background:var(--bg3); border:1px solid var(--bd);
  font-size:.78rem; transition:border-color .2s;
}
.match-row.hot { border-color:var(--rmid); background:var(--rdim); }

.tat { font-family:var(--fm); font-size:.5rem; color:var(--mt); letter-spacing:.08em; text-transform:uppercase; }
.ftr { font-weight:500; color:var(--wh); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ftr.dim { color:var(--mt); font-weight:300; }
.ftr.me  { color:var(--red); }

.sc { font-family:var(--fd); font-weight:700; font-size:1.1rem; text-align:center; letter-spacing:.04em; color:var(--wh); transition:color .3s; }
.match-row.hot .sc { color:var(--red); }

.ms { font-family:var(--fm); font-size:.5rem; letter-spacing:.05em; text-align:right; color:var(--mt); }
.ms.live-st { color:var(--red); }
.ms.next-st { color:var(--off); }
.ms.done-st { color:var(--green); }

.db-footer { padding:.7rem 1.2rem; border-top:1px solid var(--bd); display:flex; justify-content:space-between; }
.db-ft { font-family:var(--fm); font-size:.55rem; color:var(--mt); }
.db-ft.hi { color:var(--red); }

.ticker {
  border-top:1px solid var(--bd); border-bottom:1px solid var(--bd);
  background:var(--bg2); padding:.7rem 0; overflow:hidden; white-space:nowrap;
  position:relative;
}
.ticker::before, .ticker::after { content:''; position:absolute; top:0; bottom:0; width:80px; z-index:2; pointer-events:none; }
.ticker::before { left:0; background:linear-gradient(90deg,var(--bg2),transparent); }
.ticker::after  { right:0; background:linear-gradient(-90deg,var(--bg2),transparent); }
.ticker-track { display:inline-flex; gap:3rem; animation:ticker 30s linear infinite; }
.ti { font-family:var(--fm); font-size:.6rem; color:var(--mt); letter-spacing:.07em; text-transform:uppercase; display:inline-flex; align-items:center; gap:.55rem; }
.ti strong { color:var(--wh); }
.ti-sep { color:var(--red); font-size:.55rem; }

.tagline-wrap { position:relative; }
.tagline-strip {
  background:var(--red);
  padding:3.2rem 3rem 3.8rem;
  display:flex; align-items:center; justify-content:center; gap:3rem;
  position:relative; overflow:hidden;
  clip-path:polygon(0 6%, 100% 0%, 100% 94%, 0% 100%);
}
.tagline-strip::before {
  content:'VENI VIDI VICERUNT';
  position:absolute;
  font-family:var(--fd); font-weight:900; font-size:10rem; letter-spacing:.06em;
  color:rgba(0,0,0,.08); white-space:nowrap; pointer-events:none; text-transform:uppercase;
  left:50%; top:50%; transform:translate(-50%,-50%);
  user-select:none;
}
.tl-word { position:relative; text-align:center; }
.tl-latin { font-family:var(--fd); font-weight:900; font-size:clamp(1.8rem, 3.2vw, 2.6rem); text-transform:uppercase; letter-spacing:.06em; color:var(--wh); display:block; }
.tl-trans { font-family:var(--fb); font-weight:300; font-style:italic; font-size:.78rem; color:rgba(255,255,255,.55); letter-spacing:.05em; display:block; margin-top:.2rem; }
.tl-sep { color:rgba(255,255,255,.18); font-size:2rem; }

.section { padding:7rem 3rem; position:relative; }
.section-label { font-family:var(--fm); font-size:.6rem; letter-spacing:.22em; text-transform:uppercase; color:var(--red); margin-bottom:.9rem; display:flex; align-items:center; gap:.55rem; }
.section-label::before { content:''; width:16px; height:1px; background:var(--red); }
.section-title { font-family:var(--fd); font-weight:900; font-size:clamp(2rem, 3.8vw, 3rem); text-transform:uppercase; line-height:.94; letter-spacing:-.01em; color:var(--wh); margin-bottom:1.4rem; }
.section-body { font-size:.96rem; font-weight:300; line-height:1.85; color:var(--mt); max-width:460px; }

.features-section { background:var(--bg2); }
.features-intro { display:grid; grid-template-columns:1fr 1fr; gap:5rem; align-items:end; margin-bottom:3.5rem; }
.features-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--bd); }
.feat { background:var(--bg2); padding:2.4rem 1.9rem; position:relative; transition:background .2s; }
.feat:hover { background:var(--sf); }
.feat::after { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:var(--red); transform:scaleX(0); transform-origin:left; transition:transform .3s; }
.feat:hover::after { transform:scaleX(1); }
.feat-num { font-family:var(--fm); font-size:.55rem; color:var(--mt); letter-spacing:.15em; margin-bottom:1.6rem; display:block; }
.feat-tag { position:absolute; top:1.6rem; right:1.6rem; font-family:var(--fm); font-size:.5rem; color:var(--red); background:var(--rdim); padding:.16rem .48rem; border-radius:2px; letter-spacing:.08em; }
.feat-title { font-family:var(--fd); font-weight:700; font-size:1.08rem; text-transform:uppercase; letter-spacing:.04em; color:var(--wh); margin-bottom:.7rem; line-height:1.2; }
.feat-desc { font-size:.86rem; font-weight:300; line-height:1.72; color:var(--mt); }

.spec-section { display:grid; grid-template-columns:1fr 1fr; background:var(--bg); min-height:560px; }
.spec-left { padding:7rem 4rem 7rem 3rem; border-right:1px solid var(--bd); display:flex; flex-direction:column; justify-content:center; }
.spec-right { padding:7rem 3rem 7rem 4rem; background:var(--bg2); display:flex; flex-direction:column; justify-content:center; }

.tracker { background:var(--sf); border:1px solid var(--bd2); border-radius:9px; overflow:hidden; }
.tr-header { background:var(--bg3); padding:.85rem 1.1rem; border-bottom:1px solid var(--bd); display:flex; align-items:center; justify-content:space-between; }
.tr-title { font-family:var(--fm); font-size:.58rem; color:var(--mt); letter-spacing:.1em; text-transform:uppercase; }
.tr-event { font-family:var(--fm); font-size:.55rem; color:var(--red); }
.tr-body { padding:.7rem; }

.ath-row { display:flex; align-items:center; justify-content:space-between; padding:.65rem .7rem; border-radius:4px; margin-bottom:.3rem; border:1px solid transparent; transition:all .25s; }
.ath-row.is-live { background:var(--rdim); border-color:var(--rmid); animation:livePulse 3s ease-in-out infinite; }
.ath-row.is-follow { background:rgba(255,255,255,.025); border-color:var(--bd2); }
.ath-name { font-size:.83rem; font-weight:500; color:var(--wh); }
.ath-meta { font-size:.68rem; color:var(--mt); margin-top:.1rem; }

.chip { font-family:var(--fm); font-size:.53rem; letter-spacing:.06em; padding:.18rem .5rem; border-radius:3px; }
.chip-live { background:var(--rdim); color:var(--red); border:1px solid var(--rmid); }
.chip-next { background:rgba(255,255,255,.05); color:var(--off); border:1px solid var(--bd2); }
.chip-won  { background:rgba(34,197,94,.08); color:var(--green); border:1px solid rgba(34,197,94,.22); }
.chip-wait { background:rgba(90,90,90,.1); color:var(--mt); border:1px solid var(--bd); }
.sc-chip { font-family:var(--fd); font-weight:700; font-size:.98rem; color:var(--red); letter-spacing:.04em; }

@keyframes livePulse { 0%,100%{background:var(--rdim)} 50%{background:rgba(232,25,44,.15)} }

.quote-wrap { padding:5rem 3rem; background:var(--bg3); border-top:1px solid var(--bd); border-bottom:1px solid var(--bd); display:flex; align-items:center; gap:3rem; }
.q-mark { font-family:var(--fd); font-size:6rem; font-weight:900; color:var(--red); line-height:1; flex-shrink:0; opacity:.4; }
.q-text { font-size:clamp(1.05rem, 1.8vw, 1.4rem); font-weight:300; font-style:italic; line-height:1.7; color:var(--wh); max-width:580px; }
.q-attr { margin-top:1.2rem; font-family:var(--fm); font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:var(--mt); }

.stats { background:var(--sf); border-top:1px solid var(--bd); border-bottom:1px solid var(--bd); padding:3.2rem 3rem; display:grid; grid-template-columns:repeat(4,1fr); gap:2rem; text-align:center; }
.stat { border-right:1px solid var(--bd); padding:0 2rem; }
.stat:last-child { border-right:none; }
.stat-val { font-family:var(--fd); font-weight:900; font-size:clamp(2.2rem, 3.8vw, 2.9rem); color:var(--red); display:block; line-height:1; margin-bottom:.4rem; }
.stat-label { font-size:.7rem; font-weight:300; letter-spacing:.1em; text-transform:uppercase; color:var(--mt); }

.aud-section { background:var(--bg); }
.aud-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.25rem; margin-top:3.5rem; }
.aud-card { border:1px solid var(--bd); padding:2.4rem 1.9rem; border-radius:7px; background:var(--bg2); position:relative; overflow:hidden; transition:border-color .22s, transform .22s; }
.aud-card::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--red); transform:scaleX(0); transform-origin:left; transition:transform .3s; }
.aud-card:hover { border-color:var(--bd2); transform:translateY(-4px); }
.aud-card:hover::after { transform:scaleX(1); }
.aud-num { font-family:var(--fm); font-size:.55rem; color:var(--mt); letter-spacing:.12em; margin-bottom:1.4rem; display:block; }
.aud-title { font-family:var(--fd); font-weight:700; font-size:1.1rem; text-transform:uppercase; letter-spacing:.04em; color:var(--wh); margin-bottom:.8rem; }
.aud-desc { font-size:.86rem; font-weight:300; line-height:1.72; color:var(--mt); }

.cta-section { padding:9rem 3rem; background:var(--bg); text-align:center; position:relative; overflow:hidden; }
.cta-section::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(-52deg, transparent, transparent 68px, rgba(232,25,44,.016) 68px, rgba(232,25,44,.016) 69px); pointer-events:none; }
.cta-section::after { content:'VICERUNT'; position:absolute; bottom:-3rem; left:50%; transform:translateX(-50%); font-family:var(--fd); font-weight:900; font-size:19vw; text-transform:uppercase; color:rgba(255,255,255,.02); letter-spacing:.05em; pointer-events:none; white-space:nowrap; user-select:none; }
.cta-inner { position:relative; z-index:2; max-width:620px; margin:0 auto; }
.cta-title { font-family:var(--fd); font-weight:900; font-size:clamp(2.5rem, 5.5vw, 4.4rem); text-transform:uppercase; line-height:.92; letter-spacing:-.01em; color:var(--wh); margin-bottom:1rem; }
.cta-title span { color:var(--red); }
.cta-latin { font-family:var(--fd); font-weight:400; font-style:italic; font-size:1.1rem; color:var(--mt); letter-spacing:.12em; margin-bottom:1.8rem; }
.cta-latin em { color:var(--red); font-style:italic; }
.cta-body { font-size:.96rem; font-weight:300; line-height:1.78; color:var(--mt); margin-bottom:2.8rem; }
.cta-form { display:flex; max-width:440px; margin:0 auto; border:1px solid var(--bd2); border-radius:2px; overflow:hidden; background:var(--sf); transition:border-color .2s; }
.cta-form:focus-within { border-color:var(--red); }
.cta-input { flex:1; background:transparent; border:none; color:var(--wh); font-family:var(--fb); font-size:.88rem; font-weight:300; padding:.88rem 1.1rem; outline:none; }
.cta-input::placeholder { color:var(--mt); }
.cta-submit { font-family:var(--fb); font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; background:var(--red); color:var(--wh); border:none; padding:.88rem 1.35rem; cursor:pointer; transition:opacity .18s; white-space:nowrap; }
.cta-submit:hover { opacity:.84; }
#form-thanks { font-family:var(--fm); font-size:.65rem; letter-spacing:.2em; color:var(--red); margin-top:1.4rem; text-transform:uppercase; display:none; }

footer { background:var(--bg2); border-top:1px solid var(--bd); padding:2.2rem 3rem; display:flex; justify-content:space-between; align-items:center; }
.foot-brand { display:flex; flex-direction:column; gap:.12rem; text-decoration:none; }
.foot-name { font-family:var(--fd); font-weight:900; font-size:1.15rem; letter-spacing:.1em; text-transform:uppercase; color:var(--wh); display:flex; align-items:center; gap:.38rem; }
.foot-dot { width:5px; height:5px; background:var(--red); border-radius:50%; }
.foot-sub { font-family:var(--fd); font-weight:400; font-style:italic; font-size:.68rem; letter-spacing:.12em; color:var(--mt); text-transform:uppercase; }
.foot-copy { font-family:var(--fm); font-size:.58rem; color:var(--mt); }
.foot-links { display:flex; gap:2rem; list-style:none; }
.foot-links a { font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mt); text-decoration:none; transition:color .18s; }
.foot-links a:hover { color:var(--wh); }

@keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
@keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }
@keyframes blink  { 0%,100%{opacity:1} 50%{opacity:.25} }
@keyframes scoreFlash { 0%{color:var(--red);transform:scale(1.12)} 100%{color:var(--red);transform:scale(1)} }

.reveal { opacity:0; transform:translateY(20px); transition:opacity .65s ease, transform .65s ease; }
.reveal.visible { opacity:1; transform:translateY(0); }
.d1{transition-delay:.1s} .d2{transition-delay:.2s} .d3{transition-delay:.3s}

@media(max-width:960px){
  body{cursor:auto} .cur,.cur-ring{display:none}
  nav{padding:1.1rem 1.4rem} .nav-links{display:none}
  .hero{grid-template-columns:1fr;padding:6rem 1.4rem 4rem;gap:3rem}
  .hero-right{order:-1}
  .hero-ghost{font-size:30vw;bottom:-1.5rem}
